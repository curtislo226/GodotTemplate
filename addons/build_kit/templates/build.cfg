; build_kit 的專案設定（本機 build.ps1、CI、build.gd 都只讀這份）。說明見 addons/build_kit/README.md。

[build]

; 輸出檔名的前綴（不能有空白）：<name>-<版本>-windows.zip、<name>.exe
name="{name}"
; 這個專案釘的 Godot 版本（下載 Godot 與匯出模板、本機找執行檔都用它）
godot_version="{godot_version}"
; 要建的平台：web、windows
targets=PackedStringArray("web", "windows")
; 跑測試：傳給 Godot 的參數（自動加 --headless --path <專案>）；空的 = 不跑測試
; GUT：PackedStringArray("-s", "res://addons/gut/gut_cmdln.gd", "-gdir=res://tests", "-ginclude_subdirs", "-gexit")
test_args=PackedStringArray()
; 一起放進 Windows zip 的檔案（相對專案根目錄）
bundle=PackedStringArray()
; 本機 build/ 保留最近幾次建置
keep_builds=5

[test_env]

; 跑測試時設定的環境變數，一行一個（例：EP_TEST_LANGUAGE="en"）

[presets]

; 平台 → export_presets.cfg 裡的 preset 名稱
web="Web"
windows="Windows"

[export]

; 匯出時一律排除（exclude_filter 格式，相對 res://）
exclude=PackedStringArray("dev/*", "tests/*", "tools/*", "addons/gut/*", "addons/*/tests/*")
; 這些資料夾裡沒被出貨內容用到的檔案也排除（例如只用到一部分的素材包）
prune_dirs=PackedStringArray()
; 出貨內容的起點（主場景、autoload、翻譯、圖示以外）；判斷 prune_dirs 裡哪些有用到
shipped_dirs=PackedStringArray()

[itch]

; itch.io 的 user/game；空的 = 不上傳。要上傳時，先自己在 GitHub 設定 BUTLER_API_KEY（見 README「上傳 itch.io」）
target=""
; 平台 → channel；留空 = 那個平台不上傳
web="html5"
windows="windows"
